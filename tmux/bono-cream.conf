# bono theme for tmux — warm muted cream palette

# Status bar
set -g status-style 'bg=#fdf6da fg=#6a716e'
set -g status-left " "
set -g status-left-length 0

# Window status
set -g window-status-current-style 'fg=#2d6c6c bold'
set -g window-status-style 'fg=#a89888'
set -g window-status-separator ""

# Pane borders
set -g pane-border-style 'fg=#c8bfb0'
set -g pane-active-border-style 'fg=#9a4929'

# Messages
set -g message-style 'fg=#141210 bg=#f5edd2'
set -g message-command-style 'fg=#141210 bg=#f5edd2'

# Mode (copy mode, etc.)
set -g mode-style 'fg=#fdf6da bg=#9a4929'

# Clock
set -g clock-mode-colour '#9a4929'
