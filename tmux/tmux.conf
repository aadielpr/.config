set -g default-terminal "xterm-256color"


set -ga terminal-overrides ",xterm*:Tc"
set -s escape-time 0

bind r source-file ~/.config/tmux/tmux.conf

setw -g mouse on
setw -g pane-base-index 1
set -g base-index 1
set -g renumber-windows on
set -g history-limit 10000

unbind v
bind v copy-mode

set-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind | split-window -h
bind - split-window -v

# status bar
set -g status 2
set -g status-position top

# bono theme
source-file ~/.config/tmux/bono-cream.conf

# empty second line = gap between status bar and pane content
set -g status-format[1] ""

set -g window-status-current-format "#W "
set -g window-status-format "#W "

set -g status-left " "
set -g status-left-length 0

set -g status-right-length 180
set -g status-interval 60
set-option -g status-right " #S · %a %d %b %H:%M · #(/Users/gbmnx/.config/tmux/battery.sh) "

# pi coding agent state marker in window titles (working spinner / idle dot)
run-shell "/Users/gbmnx/gbmnx/dev/pit/pi-tmux.tmux"
