# Forces bold text to use the bright color palette
bold-is-bright = true

# Background and foreground
background = #101010
foreground = #b8b8b8

# Cursor colors
cursor-color = #b0b0b0
cursor-text = #101010

# Selection colors
selection-background = #272727
selection-foreground = #b0b0b0

# ANSI color palette (0-15) — greyscale
palette = 0=#101010
palette = 1=#333333
palette = 2=#444444
palette = 3=#555555
palette = 4=#666666
palette = 5=#777777
palette = 6=#888888
palette = 7=#999999
palette = 8=#282828
palette = 9=#4a4a4a
palette = 10=#5b5b5b
palette = 11=#6c6c6c
palette = 12=#7d7d7d
palette = 13=#8e8e8e
palette = 14=#9f9f9f
palette = 15=#b0b0b0
